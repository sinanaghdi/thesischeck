[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "thesischeck"
version = "0.3.0"
description = "Persian-first thesis writing-quality and format-control assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - All rights reserved unless a license is added by the owner" }
authors = [{ name = "ThesisCheck contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "Jinja2>=3.1,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "python-docx>=1.1,<2.0",
  "lxml>=5.3,<7.0",
  "pdfplumber>=0.11,<1.0",
  "PyYAML>=6.0,<7.0",
  "rapidfuzz>=3.9,<4.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]
pdf = ["playwright>=1.48,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
