name: benchmark

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Logical pages in the synthetic DOCX (1-500)"
        required: true
        default: 100
        type: number
      paragraphs_per_page:
        description: "Synthetic paragraphs per page (1-100)"
        required: true
        default: 6
        type: number
      max_seconds:
        description: "Non-binding parsing-time threshold in seconds"
        required: true
        default: 30
        type: number

permissions:
  contents: read

jobs:
  benchmark:
    name: Synthetic DOCX parser benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BENCHMARK_PAGES: ${{ inputs.pages }}
      BENCHMARK_PARAGRAPHS_PER_PAGE: ${{ inputs.paragraphs_per_page }}
      BENCHMARK_MAX_SECONDS: ${{ inputs.max_seconds }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run synthetic parsing benchmark
        run: |
          set -o pipefail
          python -m scripts.benchmark_100_page_docx \
            --pages "$BENCHMARK_PAGES" \
            --paragraphs-per-page "$BENCHMARK_PARAGRAPHS_PER_PAGE" \
            --max-seconds "$BENCHMARK_MAX_SECONDS" | tee benchmark-result.json

      - name: Add benchmark output to run summary
        if: always()
        run: |
          {
            echo "## Synthetic DOCX parser benchmark"
            echo
            echo "Runner: ubuntu-latest / Python 3.12"
            echo
            echo "This is a GitHub-hosted runner baseline, not target-host acceptance. Timing varies with shared-runner load."
            echo
            if [ -s benchmark-result.json ]; then
              cat benchmark-result.json
            else
              echo "No benchmark JSON was produced. Check the failed step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesischeck-benchmark-results
          path: benchmark-result.json
          if-no-files-found: warn
          retention-days: 14
