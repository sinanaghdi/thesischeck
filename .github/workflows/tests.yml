name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .

  docker-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test fixture dependency
        run: python -m pip install python-docx
      - name: Configure ephemeral Compose token
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          import os
          import secrets

          path = Path(".env")
          content = path.read_text(encoding="utf-8")
          replacements = {
              "PARSER_SERVICE_TOKEN=": f"PARSER_SERVICE_TOKEN={secrets.token_urlsafe(48)}",
              "THESISCHECK_BASIC_AUTH_USERNAME=thesischeck-demo": "THESISCHECK_BASIC_AUTH_USERNAME=thesischeck-ci",
              "THESISCHECK_BASIC_AUTH_PASSWORD=": f"THESISCHECK_BASIC_AUTH_PASSWORD={secrets.token_urlsafe(32)}",
          }
          for before, after in replacements.items():
              if content.count(before) != 1:
                  raise SystemExit(f"Expected exactly one setting: {before}")
              content = content.replace(before, after)
          path.write_text(content, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("THESISCHECK_BASIC_AUTH_USERNAME=thesischeck-ci\n")
              env_file.write(
                  f"THESISCHECK_BASIC_AUTH_PASSWORD={replacements['THESISCHECK_BASIC_AUTH_PASSWORD'].split('=', 1)[1]}\n"
              )
          PY
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated demo stack
        run: docker compose up -d --build
      - name: Inspect startup and validate Nginx runtime configuration
        run: |
          docker compose ps -a
          docker compose exec -T edge nginx -t
      - name: Wait for public edge health route
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          last_error = None
          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("service") == "thesischeck" and payload.get("status") == "ok":
                      print("Nginx edge and web API are ready")
                      break
                  last_error = RuntimeError(f"Unexpected health payload: {payload}")
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"Health check timed out: {last_error}")
          PY
      - name: Generate synthetic DOCX and inspect it through Nginx
        run: |
          python - <<'PY'
          from docx import Document

          document = Document()
          document.add_heading("Synthetic Docker smoke test", level=1)
          document.add_paragraph(
              "This fictional text validates the web-to-parser-service request path."
          )
          document.save("/tmp/thesischeck-smoke.docx")
          PY
          curl --fail-with-body --silent --show-error \
            --user "$THESISCHECK_BASIC_AUTH_USERNAME:$THESISCHECK_BASIC_AUTH_PASSWORD" \
            -F "file=@/tmp/thesischeck-smoke.docx" \
            http://127.0.0.1:8000/api/v1/inspect \
            -o /tmp/thesischeck-inspect.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/thesischeck-inspect.json").read_text(encoding="utf-8"))
          assert payload["source_format"] == "docx", payload
          assert payload["element_count"] > 0, payload
          assert isinstance(payload["health_report"], dict), payload
          print(f"Inspection smoke test passed with {payload['element_count']} extracted elements")
          PY
      - name: Validate JSON report export through Nginx
        run: |
          curl --fail-with-body --silent --show-error \
            --user "$THESISCHECK_BASIC_AUTH_USERNAME:$THESISCHECK_BASIC_AUTH_PASSWORD" \
            -F "file=@/tmp/thesischeck-smoke.docx" \
            "http://127.0.0.1:8000/api/v1/report?format=json" \
            -o /tmp/thesischeck-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/thesischeck-report.json").read_text(encoding="utf-8"))
          assert isinstance(report, dict) and report, report
          print("JSON report export smoke test passed")
          PY
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --remove-orphans --volumes
