# Local/demo reverse-proxy edge. Keep MAX_UPLOAD_MB at 30 unless updating
# client_max_body_size to the configured file limit plus multipart framing.
limit_req_zone $binary_remote_addr zone=inspection_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=inspection_conn_per_ip:10m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 31m;
    client_body_timeout 15s;
    send_timeout 65s;
    keepalive_timeout 15s;
    client_body_temp_path /tmp/client_body 1 2;
    proxy_temp_path /tmp/proxy_temp;

    location = /api/v1/inspect {
        limit_req zone=inspection_per_ip burst=5 nodelay;
        limit_conn inspection_conn_per_ip 2;
        limit_req_status 429;

        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://web:8000;
    }

    location = /api/v1/report {
        limit_req zone=inspection_per_ip burst=5 nodelay;
        limit_conn inspection_conn_per_ip 2;
        limit_req_status 429;

        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://web:8000;
    }
}
