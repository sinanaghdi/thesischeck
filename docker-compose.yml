services:
  edge:
    image: nginx:stable-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      - edge-exposure
      - edge-private
    restart: unless-stopped
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m"
      - "/run:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101,mode=0755"
      - "/var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0755"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.50"
    ulimits:
      nofile:
        soft: 2048
        hard: 4096

  web:
    build: .
    env_file:
      - .env
    environment:
      PARSER_BACKEND: service
      PARSER_SERVICE_URL: http://parser:8001
      PARSER_SERVICE_TOKEN: ${PARSER_SERVICE_TOKEN:?Set PARSER_SERVICE_TOKEN in .env}
      BASIC_AUTH_ENABLED: "true"
      BASIC_AUTH_USERNAME: ${THESISCHECK_BASIC_AUTH_USERNAME:?Set THESISCHECK_BASIC_AUTH_USERNAME in .env}
      BASIC_AUTH_PASSWORD: ${THESISCHECK_BASIC_AUTH_PASSWORD:?Set THESISCHECK_BASIC_AUTH_PASSWORD in .env}
      INSPECTION_RATE_LIMIT: "1000"
      INSPECTION_RATE_WINDOW_SECONDS: "60"
    depends_on:
      parser:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - edge-private
      - parser-private
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=192m"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 256
        hard: 512

  parser:
    build: .
    command: ["uvicorn", "app.parsing.service:app", "--host", "0.0.0.0", "--port", "8001", "--limit-concurrency", "2"]
    environment:
      APP_NAME: "ThesisCheck Parser"
      APP_ENV: development
      DEBUG: "false"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
      PARSER_WORKER_TIMEOUT_SECONDS: ${PARSER_WORKER_TIMEOUT_SECONDS:-35}
      PARSER_WORKER_CPU_SECONDS: ${PARSER_WORKER_CPU_SECONDS:-25}
      PARSER_WORKER_MEMORY_MB: ${PARSER_WORKER_MEMORY_MB:-1024}
      PARSER_WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-2}
      PARSER_SERVICE_TOKEN: ${PARSER_SERVICE_TOKEN:?Set PARSER_SERVICE_TOKEN in .env}
    networks:
      - parser-private
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=192m"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1536m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 128
        hard: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  edge-exposure: {}
  edge-private:
    internal: true
  parser-private:
    internal: true
